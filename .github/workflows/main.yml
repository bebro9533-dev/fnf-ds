name: Build NDS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: fnf_ds
          path: fnf_ds.nds
